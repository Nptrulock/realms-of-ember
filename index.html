<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Realms of Ember — Idle RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo">🔥 <span>Realms of Ember</span></div>
    <div id="res"></div>
    <button id="speedBtn" data-a="speed" title="Game speed">1×</button>
  </header>
  <main>
    <section id="left">
      <div id="stage">
        <div id="bg"></div><div id="deco"></div>
        <div id="zoneTitle"></div>
        <div id="heroSide"><div id="hero" class="unit hero"><div class="aura"></div><div class="spr"></div><div class="wpn"></div><div class="shieldfx"></div></div><div id="allies"></div></div>
        <div id="enemySide"></div>
        <div id="profScene"></div>
        <canvas id="fx"></canvas>
        <div id="floaters"></div>
        <div id="banner"></div>
      </div>
      <div id="heroBars"></div>
      <div id="skillBar"></div>
      <div id="zoneBar"></div>
      <div id="slotsStrip"></div>
    </section>
    <section id="right">
      <nav id="tabs"></nav>
      <div id="panel"></div>
    </section>
  </main>
  <div id="modal" class="hidden"></div>
  <div id="toasts"></div>
</div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
